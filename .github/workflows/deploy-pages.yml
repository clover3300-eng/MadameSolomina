# Деплой на GitHub Pages собственным workflow вместо встроенной очереди
# «pages build and deployment» (та регулярно застревала в queued/Waiting без логов).
# Плюсы: видимые логи, кнопка Re-run при сбое, ручной запуск через workflow_dispatch
# (вкладка Actions → Deploy to GitHub Pages → Run workflow) — пустые коммиты больше не нужны.
# Шаг configure-pages с enablement:true сам переключает Source репозитория на «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# новый пуш отменяет ещё не начавшийся старый деплой — очередь не копится
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
